{% extends 'cafe/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 p-5">
            <h3 class="fw-bold text-danger mb-3">Confirm Deletion</h3>
            <p class="text-muted">Are you sure you want to delete <strong>"{{ object.name }}"</strong> from the menu? This action cannot be undone.</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4 fw-bold">Yes, Delete</button>
                <a href="{% url 'menu_list' %}" class="btn btn-secondary px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
