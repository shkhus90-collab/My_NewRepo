{% extends 'cafe/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4">
            <h2 class="fw-bold mb-4 text-center">Manage Menu Item</h2>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 fw-bold mt-3">Save Item</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'menu_list' %}" class="text-decoration-none text-muted">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
