
<form method="post">
    {% csrf_token %}
    <!-- your input fields here -->
     <label>Student Roll Number:</label>
    <input type="text" name="student_roll_number" required><br><br>

    <label>Library Card Number:</label>
    <input type="text" name="library_card_number" required><br><br>

    <label>Book Title:</label>
    <input type="text" name="book_title" required><br><br>

    <label>Author Name:</label>
    <input type="text" name="author_name" required><br><br>

    <label>Issue Date:</label>
    <input type="date" name="issue_date" required><br><br>
    <button type="submit">Next</button>
</form>
